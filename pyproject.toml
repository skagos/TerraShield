[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfreader-iac"
version = "0.1.1"
description = "Terraform IaC parser and security analyzer with API and CLI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tfreader contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "fastapi>=0.143.0,<0.144",
  "pydantic>=2.14.1,<3",
  "uvicorn>=0.54.0,<0.55",
  "python-multipart>=0.0.32,<0.1",
  "python-hcl2==5.1.1",
]

[project.urls]
Homepage = "https://github.com/skagos/TerraShield"
Issues = "https://github.com/skagos/TerraShield/issues"

[project.scripts]
tfreader = "app.cli:cli_entrypoint"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "frontend"]

[tool.setuptools.package-data]
frontend = ["*.html", "*.js", "*.css"]
