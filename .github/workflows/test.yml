name: Python compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl httpx
      - name: Test installed distribution outside the checkout
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/tests/test_distribution.py"
